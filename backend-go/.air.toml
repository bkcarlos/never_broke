# Air 配置文件 - Go 项目热重载工具
# 文档: https://github.com/cosmtrek/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 传递给二进制文件的参数
  args_bin = []
  
  # 编译后的二进制文件路径
  bin = "./tmp/main"
  
  # 编译命令 - 从 cmd/server 目录构建
  cmd = "go build -o ./tmp/main ./cmd/server"
  
  # 文件更改后延迟重新构建的时间（毫秒）
  delay = 1000
  
  # 执行的二进制文件
  entrypoint = ["./tmp/main"]
  
  # 排除的目录
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "logs", "migrations"]
  
  # 排除的文件
  exclude_file = []
  
  # 排除的文件正则表达式
  exclude_regex = ["_test\\.go"]
  
  # 如果文件未更改则不重新构建
  exclude_unchanged = false
  
  # 跟随符号链接
  follow_symlink = false
  
  # 完整的二进制命令（如果需要环境变量等）
  full_bin = ""
  
  # 监听的目录（空表示监听所有）
  include_dir = []
  
  # 监听的文件扩展名
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  
  # 监听的特定文件
  include_file = []
  
  # 发送 SIGKILL 前的延迟时间
  kill_delay = "500ms"
  
  # 构建错误日志文件
  log = "build-errors.log"
  
  # 使用轮询而不是 fsnotify（某些系统需要）
  poll = false
  poll_interval = 0
  
  # 构建后执行的命令
  post_cmd = []
  
  # 构建前执行的命令（例如：go generate）
  pre_cmd = []
  
  # 立即重新运行而不是等待文件更改
  rerun = false
  rerun_delay = 500
  
  # 发送中断信号而不是 kill
  send_interrupt = false
  
  # 构建错误时停止运行
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  # 只显示主进程日志
  main_only = false
  
  # 静默模式
  silent = false
  
  # 显示时间戳
  time = true

[misc]
  # 退出时清理临时文件
  clean_on_exit = true

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  # 重新构建时清屏
  clear_on_rebuild = true
  
  # 保持滚动位置
  keep_scroll = true
